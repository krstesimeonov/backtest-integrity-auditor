# Documentation site. Build: `mkdocs build --strict` (requirements-docs.txt).
# New pages are the top of the nav; the design records that already lived in
# docs/ are served unchanged further down. docs/review/ (internal review notes)
# and docs/history/ (earlier jobs' run notes, kept by the release candidate)
# are not published.
site_name: Backtest Integrity Auditor
site_description: Evidence-first integrity auditing for backtest results.
site_author: Krste Simeonov
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

exclude_docs: |
  review/
  history/
  snippets/
  edge_audit/
  learning/
  kat/

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            heading_level: 3
            members_order: source
            show_if_no_docstring: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [docs/snippets]
      check_paths: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - How-to guides:
      - vectorbt: how-to/vectorbt.md
      - bt: how-to/bt.md
      - Backtrader: how-to/backtrader.md
      - QuantConnect LEAN: how-to/quantconnect-lean.md
      - NautilusTrader: how-to/nautilustrader.md
